<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#25434B">
<meta name="referrer" content="no-referrer">
<title>Professionell beraten – KB II Beratung</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="kopf">
  <p class="kopfzeile" id="kopfzeile"></p>
  <h1 id="titel"></h1>
</header>
<main class="inhalt">
  <p class="anweisung" id="einleitung"></p>
  <nav class="startlinks">
    <a class="startlink" href="aa1.html" id="link-aa1"></a>
    <a class="startlink" href="aa2.html" id="link-aa2"></a>
  </nav>
</main>
<script src="inhalte.js"></script>
<script src="config.js"></script>
<script src="gemeinsam.js"></script>
<script>
  (function () {
    var S = INHALTE.start;
    document.getElementById('kopfzeile').textContent = INHALTE.allgemein.kopfzeile;
    document.getElementById('titel').textContent = S.titel;
    document.getElementById('einleitung').textContent = S.einleitung;
    var l1 = document.getElementById('link-aa1'), l2 = document.getElementById('link-aa2');
    l1.textContent = S.linkAA1;
    l2.textContent = S.linkAA2;
    if (KB2.Freischaltung.istGeloest('aa1')) l1.classList.add('erledigt');
    if (KB2.Freischaltung.istGeloest('aa2')) l2.classList.add('erledigt');
  })();
</script>
</body>
</html>
